name: Wallflow sound control input smoke

on:
  push:
    paths:
      - wallflow-sound-control-input-smoke/**
      - .github/workflows/wallflow-sound-control-input-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Build with complete concurrency checking
        run: >-
          swift build
          --package-path wallflow-sound-control-input-smoke
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
      - name: Validate sound control input ownership
        run: >-
          swift run
          --package-path wallflow-sound-control-input-smoke
          wallflow-sound-control-input-smoke
