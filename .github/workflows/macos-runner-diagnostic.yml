name: macOS Metal actor-isolation diagnostic

on:
  push:
    branches:
      - diag/github-actions-macos-runner-20260903
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  metal-completion-handler:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Runner and Swift information
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Compile nonisolated Metal completion relay
        run: |
          cat > /tmp/metal-actor-relay.swift <<'SWIFT'
          import Foundation
          import Metal

          enum SmokeError: Error {
              case noDevice
              case noCommandQueue
              case noCommandBuffer
              case completionDidNotFinish
          }

          @MainActor
          final class CompletionOwner {
              private var didFinish = false
              private var succeeded = false

              func run() async throws {
                  guard let device = MTLCreateSystemDefaultDevice() else {
                      throw SmokeError.noDevice
                  }
                  guard let queue = device.makeCommandQueue() else {
                      throw SmokeError.noCommandQueue
                  }
                  guard let commandBuffer = queue.makeCommandBuffer() else {
                      throw SmokeError.noCommandBuffer
                  }

                  // The handler is created in an explicitly nonisolated context. This
                  // prevents the callback itself from inheriting MainActor isolation
                  // before Metal invokes it on a driver-owned background thread.
                  commandBuffer.addCompletedHandler(
                      Self.makeCompletionHandler(owner: self)
                  )
                  commandBuffer.commit()
                  commandBuffer.waitUntilCompleted()

                  for _ in 0..<100 where !didFinish {
                      await Task.yield()
                  }
                  guard didFinish, succeeded else {
                      throw SmokeError.completionDidNotFinish
                  }
              }

              nonisolated private static func makeCompletionHandler(
                  owner: CompletionOwner
              ) -> MTLCommandBufferHandler {
                  { commandBuffer in
                      let succeeded = commandBuffer.status == .completed
                      Task { @MainActor in
                          owner.finish(succeeded: succeeded)
                      }
                  }
              }

              private func finish(succeeded: Bool) {
                  self.succeeded = succeeded
                  didFinish = true
              }
          }

          @main
          struct Main {
              static func main() async throws {
                  let owner = await CompletionOwner()
                  try await owner.run()
                  print("nonisolated Metal completion relay OK")
              }
          }
          SWIFT

          swiftc \
            -swift-version 6 \
            -parse-as-library \
            /tmp/metal-actor-relay.swift \
            -o /tmp/metal-actor-relay
          /tmp/metal-actor-relay

      - name: Compile authored product-layer attachment invariant
        run: |
          cat > /tmp/product-layer-attachment.swift <<'SWIFT'
          import Foundation

          struct Effect: Equatable {
              let objectIndex: Int
              let effectIndex: Int
              let objectID: Int?
          }

          enum ProductPayload {
              case archiveBackedImage
              case generated
          }

          struct ProductLayer {
              let drawOrder: Int
              let objectID: Int?
              let payload: ProductPayload
          }

          enum AttachmentError: Error, Equatable {
              case inconsistentAuthoredObjectID(objectIndex: Int)
              case missingProductImageLayer(objectIndex: Int, objectID: Int?)
              case ambiguousProductImageLayer(
                  objectIndex: Int,
                  objectID: Int?,
                  productLayerIndices: [Int]
              )
          }

          struct Attachment: Equatable {
              let productLayerIndex: Int
              let authoredObjectIndex: Int
              let objectID: Int?
              let effects: [Effect]
          }

          func attach(
              effects: [Effect],
              productLayers: [ProductLayer]
          ) throws -> [Attachment] {
              let effectsByObjectIndex = Dictionary(
                  grouping: effects,
                  by: { $0.objectIndex }
              )
              return try effectsByObjectIndex.keys.sorted().map { objectIndex in
                  let effects = (effectsByObjectIndex[objectIndex] ?? []).sorted {
                      $0.effectIndex < $1.effectIndex
                  }
                  let authoredObjectIDs = Set(effects.map(\.objectID))
                  guard authoredObjectIDs.count == 1 else {
                      throw AttachmentError.inconsistentAuthoredObjectID(
                          objectIndex: objectIndex
                      )
                  }
                  let objectID = authoredObjectIDs.first ?? nil
                  let productLayerIndices = productLayers.enumerated().compactMap { index, layer in
                      guard layer.drawOrder == objectIndex,
                            layer.payload == .archiveBackedImage,
                            layer.objectID == objectID else {
                          return nil
                      }
                      return index
                  }
                  guard let productLayerIndex = productLayerIndices.first else {
                      throw AttachmentError.missingProductImageLayer(
                          objectIndex: objectIndex,
                          objectID: objectID
                      )
                  }
                  guard productLayerIndices.count == 1 else {
                      throw AttachmentError.ambiguousProductImageLayer(
                          objectIndex: objectIndex,
                          objectID: objectID,
                          productLayerIndices: productLayerIndices
                      )
                  }
                  return Attachment(
                      productLayerIndex: productLayerIndex,
                      authoredObjectIndex: objectIndex,
                      objectID: objectID,
                      effects: effects
                  )
              }
          }

          @main
          struct Main {
              static func main() throws {
                  let effects = [
                      Effect(objectIndex: 3, effectIndex: 1, objectID: 9),
                      Effect(objectIndex: 3, effectIndex: 0, objectID: 9)
                  ]
                  let productLayers = [
                      ProductLayer(drawOrder: 3, objectID: nil, payload: .generated),
                      ProductLayer(drawOrder: 3, objectID: 9, payload: .archiveBackedImage)
                  ]
                  let attachments = try attach(
                      effects: effects,
                      productLayers: productLayers
                  )
                  precondition(attachments == [Attachment(
                      productLayerIndex: 1,
                      authoredObjectIndex: 3,
                      objectID: 9,
                      effects: effects.sorted { $0.effectIndex < $1.effectIndex }
                  )])

                  do {
                      _ = try attach(
                          effects: effects,
                          productLayers: [
                              ProductLayer(
                                  drawOrder: 3,
                                  objectID: 10,
                                  payload: .archiveBackedImage
                              )
                          ]
                      )
                      preconditionFailure("object identity mismatch must fail closed")
                  } catch AttachmentError.missingProductImageLayer(
                      objectIndex: 3,
                      objectID: 9
                  ) {
                      // Expected.
                  }

                  do {
                      _ = try attach(
                          effects: effects,
                          productLayers: [
                              ProductLayer(
                                  drawOrder: 3,
                                  objectID: 9,
                                  payload: .archiveBackedImage
                              ),
                              ProductLayer(
                                  drawOrder: 3,
                                  objectID: 9,
                                  payload: .archiveBackedImage
                              )
                          ]
                      )
                      preconditionFailure("ambiguous ownership must fail closed")
                  } catch AttachmentError.ambiguousProductImageLayer(
                      objectIndex: 3,
                      objectID: 9,
                      productLayerIndices: [0, 1]
                  ) {
                      // Expected.
                  }

                  print("authored product-layer attachment invariant OK")
              }
          }
          SWIFT

          swiftc \
            -swift-version 6 \
            -parse-as-library \
            /tmp/product-layer-attachment.swift \
            -o /tmp/product-layer-attachment
          /tmp/product-layer-attachment

  linux-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Control runner
        run: |
          uname -a
          echo "Linux GitHub Actions runner OK"
