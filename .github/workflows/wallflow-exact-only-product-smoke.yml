name: Wallflow exact-only product smoke

on:
  push:
    paths:
      - wallflow-exact-only-product-smoke/**
      - .github/workflows/wallflow-exact-only-product-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Build with complete concurrency checking
        run: >-
          swift build
          --package-path wallflow-exact-only-product-smoke
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
      - name: Validate exact-only product ownership
        run: >-
          swift run
          --package-path wallflow-exact-only-product-smoke
          wallflow-exact-only-product-smoke
