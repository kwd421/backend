name: Clean obsolete Metal smoke draft

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-metal-transaction-smoke-v1.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove superseded draft harness
        run: |
          git rm -r --ignore-unmatch macos-metal-transaction-smoke
          git rm --ignore-unmatch .github/workflows/macos-metal-transaction-smoke.yml
          git rm --ignore-unmatch .github/workflows/cleanup-metal-transaction-smoke-v1.yml
      - name: Commit cleanup
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove superseded Metal smoke draft [skip ci]'
          git push origin HEAD:main
