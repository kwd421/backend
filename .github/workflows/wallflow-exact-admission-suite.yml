name: Wallflow exact admission suite

on:
  push:
    paths:
      - wallflow-exact-only-product-smoke/**
      - wallflow-product-plan-admission-smoke/**
      - wallflow-object-admission-smoke/**
      - wallflow-attachment-admission-smoke/**
      - .github/workflows/wallflow-exact-admission-suite.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Swift toolchain
        run: swift --version
      - name: Validate exact-only product ownership
        run: >-
          swift run
          --package-path wallflow-exact-only-product-smoke
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          wallflow-exact-only-product-smoke
      - name: Validate product-plan preflight
        run: >-
          swift run
          --package-path wallflow-product-plan-admission-smoke
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          wallflow-product-plan-admission-smoke
      - name: Validate complete object ownership
        run: >-
          swift run
          --package-path wallflow-object-admission-smoke
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          wallflow-object-admission-smoke
      - name: Validate attachment ownership identity
        run: >-
          swift run
          --package-path wallflow-attachment-admission-smoke
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          wallflow-attachment-admission-smoke
      - name: Publish successful suite marker
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p wallflow-smoke-status
          {
            echo "status=success"
            echo "source_sha=${SOURCE_SHA}"
            echo "run_id=${RUN_ID}"
            echo "runner=macos-15"
            echo "swift_strict_concurrency=complete"
            echo "warnings_as_errors=true"
          } > wallflow-smoke-status/exact-admission-suite.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallflow-smoke-status/exact-admission-suite.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record exact admission suite success [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
